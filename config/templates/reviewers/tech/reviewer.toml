# Technical reviewer: architecture, security, performance, reliability, conventions.
output_mode = "inline"     # findings anchored on the diff lines
priority = 10              # runs first (the most useful one if the budget runs out)
# model = "claude-opus-4-8"  # model for THIS reviewer; empty = CLAUDE_MODEL, otherwise CLI default
# when.paths absent = triggers on every PR

# enabled = false        # puts this reviewer to sleep without deleting its folder
# max_turns = 30         # review turns; raise it for a reviewer with a broad scope

# [verification]         # findings verification pass (enabled by default)
# enabled = true
# model = ""             # empty = the reviewer's model
# max_turns = 15

[context]
# Project conventions, READ FROM THE REVIEWED REPOSITORY at each review (never copied here:
# a copy drifts from the repo at the first change). File -> injected content;
# folder -> inventory of its .md files. A path that cannot be found is reported as a WARNING.
# CLAUDE.md, AGENTS.md and .claude/rules/ are read automatically: do not list them.
read = [
  "CONTRIBUTING.md",
  "docs/",
]

# [plugins]
# Skills and agents this reviewer needs, installed before the review (idempotent).
# ⚠️ A plugin is THIRD-PARTY CODE running alongside the job's secrets: review it like
# code. The core keeps its tool allowlist — a plugin skill gets no more rights than the
# reviewer.
# marketplaces = ["owner/marketplace-repo"]
# install      = ["my-plugin"]             # or "my-plugin@marketplace"
