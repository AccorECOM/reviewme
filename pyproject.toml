[project]
name = "reviewme"
version = "1.1.1"
description = "Bot de code review IA : commentaires inline ligne-par-ligne + cycle de vie des threads, multi-entrées (CLI / poll / webhook / CI)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "python-dotenv>=1.1",
]

[project.optional-dependencies]
# Auth GitHub App (identité dédiée). Non requis avec un PAT : `uv sync --extra github-app`.
github-app = ["pyjwt[crypto]>=2.10"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reviewme"]

[project.scripts]
reviewme = "reviewme.cli:main"            # one-shot : reviewme review --repo O/R --pr N
reviewme-poll = "reviewme.poll:main"       # boucle de poll (mode VPS/legacy)
reviewme-webhook = "reviewme.webhook:main" # serveur webhook (HMAC)
reviewme-web = "reviewme.web.server:main"  # dashboard read-only

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",     # longueur de ligne : les commentaires explicatifs priment
  "RUF001",   # caractères « ambigus » : la doc et les prompts sont en français
  "RUF002",
  "RUF003",
  "SIM115",   # les deux `open()` concernés sont fermés dans un `finally`
  "UP042",    # `Severity(str, Enum)` -> `StrEnum` changerait `str(Severity.X)` de
              # "Severity.X" à "X" : pas de gain, et une sémantique modifiée pour un linter
]
