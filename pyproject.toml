[project]
name = "reviewme"
version = "1.2.0"
description = "AI code review bot: line-by-line inline comments + thread lifecycle, multiple entry points (CLI / poll / webhook / CI)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "python-dotenv>=1.1",
]

[project.optional-dependencies]
# GitHub App auth (dedicated identity). Not needed with a PAT: `uv sync --extra github-app`.
github-app = ["pyjwt[crypto]>=2.10"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reviewme"]

[project.scripts]
reviewme = "reviewme.cli:main"            # one-shot : reviewme review --repo O/R --pr N
reviewme-poll = "reviewme.poll:main"       # boucle de poll (mode VPS/legacy)
reviewme-webhook = "reviewme.webhook:main" # serveur webhook (HMAC)
reviewme-web = "reviewme.web.server:main"  # dashboard read-only

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",     # line length: explanatory comments come first
  "RUF001",   # "ambiguous" characters: docs and prompts contain typographic quotes and accents
  "RUF002",
  "RUF003",
  "SIM115",   # both `open()` calls concerned are closed in a `finally`
  "UP042",    # `Severity(str, Enum)` -> `StrEnum` would change `str(Severity.X)` from
              # "Severity.X" to "X": no gain, and a semantic change for a linter
]
